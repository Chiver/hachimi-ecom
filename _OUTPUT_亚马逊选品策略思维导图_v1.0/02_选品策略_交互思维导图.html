<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哈佛团队亚马逊选品策略全景思维导图 v2.0</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0a0e1a;
  color: #e8eaed;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* Header */
.header { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); padding: 16px 24px; border-bottom: 2px solid #3949ab; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
.header .meta { font-size: 12px; color: #c5cae9; margin-top: 4px; }
.header-controls { display: flex; gap: 12px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.search-box { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 4px; width: 280px; font-size: 13px; }
.search-box::placeholder { color: #9fa8da; }
.search-box:focus { outline: none; border-color: #7986cb; }
.btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn:hover { background: rgba(255,255,255,0.25); }
.btn.active { background: #fbbf24; color: #1f2937; font-weight: 700; border-color: #fbbf24; }

.tab-switcher { display: flex; gap: 0; margin-right: 12px; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 4px; }
.tab-btn { background: transparent; color: #c5cae9; border: none; padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 600; border-radius: 4px; transition: all 0.2s; }
.tab-btn.active { background: #fbbf24; color: #1f2937; }

.legend { display: flex; gap: 8px; margin-left: auto; font-size: 11px; flex-wrap: wrap; }
.legend-item { display: inline-flex; align-items: center; gap: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }

/* Layout */
.container { display: grid; grid-template-columns: minmax(440px, 1fr) 2fr; height: calc(100vh - 120px); overflow: hidden; }
.tree-panel { background: #131825; border-right: 1px solid #1f2940; overflow-y: auto; padding: 16px; }
.detail-panel { background: #0e1320; overflow-y: auto; padding: 24px 32px; }

/* Tree */
.cluster { margin-bottom: 8px; border-radius: 6px; overflow: hidden; }
.cluster-header { padding: 12px 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
.cluster-header:hover { filter: brightness(1.2); }
.cluster-header .toggle { transition: transform 0.2s; font-size: 11px; width: 12px; }
.cluster.collapsed .toggle { transform: rotate(-90deg); }
.cluster.collapsed .cluster-body { display: none; }
.cluster-body { background: rgba(0,0,0,0.25); padding: 4px 0; }

.l2-node { padding: 8px 14px 8px 36px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
.l2-node:hover { background: rgba(255,255,255,0.05); border-left-color: rgba(255,255,255,0.4); }
.l2-node.active { background: rgba(99,179,237,0.15) !important; border-left-color: #63b3ed !important; color: #90cdf4; font-weight: 600; }

/* Cluster colors */
.c-c1 { background: linear-gradient(90deg, #1e3a8a 0%, #1e40af 100%); }
.c-c2 { background: linear-gradient(90deg, #14532d 0%, #166534 100%); }
.c-c3 { background: linear-gradient(90deg, #7f1d1d 0%, #991b1b 100%); }
.c-c4 { background: linear-gradient(90deg, #7c2d12 0%, #9a3412 100%); }
.c-c5 { background: linear-gradient(90deg, #581c87 0%, #6b21a8 100%); }
.c-c6 { background: linear-gradient(90deg, #713f12 0%, #854d0e 100%); }
.c-c7 { background: linear-gradient(90deg, #44403c 0%, #57534e 100%); }

.dot-c1 { background: #3b82f6; }
.dot-c2 { background: #22c55e; }
.dot-c3 { background: #ef4444; }
.dot-c4 { background: #f97316; }
.dot-c5 { background: #a855f7; }
.dot-c6 { background: #eab308; }
.dot-c7 { background: #a8a29e; }

/* Detail panel */
.detail-empty { text-align: center; padding: 60px 20px; color: #6b7280; }
.detail-empty h2 { font-size: 24px; margin-bottom: 12px; color: #9ca3af; }
.detail-empty p { font-size: 14px; max-width: 480px; margin: 0 auto; }

.detail-header { border-bottom: 1px solid #1f2940; padding-bottom: 16px; margin-bottom: 20px; }
.detail-breadcrumb { font-size: 11px; color: #6b7280; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.detail-title { font-size: 22px; font-weight: 600; color: #f3f4f6; margin-bottom: 8px; }
.detail-philosophy { font-size: 13px; color: #9ca3af; font-style: italic; padding: 8px 12px; background: rgba(99,179,237,0.06); border-left: 3px solid #63b3ed; border-radius: 0 4px 4px 0; }

.section { margin-bottom: 24px; }
.section-title { font-size: 14px; font-weight: 600; color: #93c5fd; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px dashed #1f2940; }
.section-title .icon { font-size: 16px; }
.section-body { font-size: 13px; color: #d1d5db; line-height: 1.7; }
.section-body p { margin-bottom: 6px; }

/* NEW: Detailed Narrative (the long-form explanation) */
.narrative {
  background: linear-gradient(135deg, #1a1f2e 0%, #1e293b 100%);
  border-radius: 8px;
  padding: 18px 22px;
  font-size: 13.5px;
  line-height: 1.85;
  color: #e5e7eb;
  border-left: 4px solid #fbbf24;
  white-space: pre-wrap;
}
.narrative p { margin-bottom: 10px; }

/* NEW: Parameter Detail Cards */
.param-grid { display: flex; flex-direction: column; gap: 10px; }
.param-card {
  background: #131a2a;
  border: 1px solid #1f2940;
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 12.5px;
}
.param-card .pname {
  font-size: 14px;
  font-weight: 700;
  color: #fde68a;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.param-card .pname::before {
  content: "📐";
  font-size: 14px;
}
.param-row { display: grid; grid-template-columns: 70px 1fr; gap: 8px; padding: 4px 0; align-items: start; }
.param-row .label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  text-align: center;
}
.label-what { background: #1e3a8a; color: #bfdbfe; }
.label-why { background: #422006; color: #fdba74; }
.label-high { background: #4c1d95; color: #c4b5fd; }
.label-low { background: #064e3b; color: #6ee7b7; }
.label-sweet { background: #14532d; color: #86efac; }
.label-eg { background: #831843; color: #f9a8d4; }
.param-row .value { color: #d1d5db; line-height: 1.6; }

/* NEW: Case Compare */
.case-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.case-good, .case-bad {
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 12.5px;
}
.case-good { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); border-left: 4px solid #22c55e; }
.case-bad { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); border-left: 4px solid #ef4444; }
.case-good .ctitle, .case-bad .ctitle { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.case-good .ctitle { color: #86efac; }
.case-bad .ctitle { color: #fca5a5; }
.case-details { margin-bottom: 10px; }
.case-details div { padding: 3px 0; color: #e5e7eb; font-size: 12px; }
.case-reason { font-size: 12px; color: #cbd5e1; font-style: italic; line-height: 1.6; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 8px; margin-top: 8px; }
.case-insight {
  margin-top: 12px;
  background: rgba(251, 191, 36, 0.1);
  border-left: 3px solid #fbbf24;
  padding: 10px 14px;
  font-size: 12.5px;
  color: #fef3c7;
  line-height: 1.7;
  border-radius: 0 6px 6px 0;
}
.case-insight strong { color: #fde047; }

/* Pipeline */
.pipeline-step { background: #1e293b; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; font-size: 12px; position: relative; flex: 0 0 auto; margin-right: 14px; margin-bottom: 8px; display: inline-block; }
.pipeline-step::after { content: "→"; position: absolute; right: -14px; top: 50%; transform: translateY(-50%); color: #4b5563; }
.pipeline-step:last-child::after { display: none; }

/* Params table */
.params-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
.params-table th { background: #1f2937; color: #93c5fd; padding: 8px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #374151; white-space: nowrap; }
.params-table td { padding: 6px 10px; border-bottom: 1px solid #1f2937; color: #d1d5db; vertical-align: top; }
.params-table tr:hover { background: rgba(255,255,255,0.02); }
.params-table .red { color: #ef4444; }
.params-table .yellow { color: #eab308; }
.params-table .green { color: #22c55e; }

.conf { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.conf-high { background: #14532d; color: #4ade80; }
.conf-mid { background: #713f12; color: #facc15; }
.conf-low { background: #7f1d1d; color: #f87171; }
.source-tag { display: inline-block; background: #1e293b; color: #93c5fd; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-right: 4px; }

.case-card { background: #1a1f2e; border-left: 3px solid #fbbf24; padding: 10px 14px; margin-bottom: 8px; border-radius: 0 4px 4px 0; font-size: 12px; }
.case-title { font-weight: 600; color: #fde68a; margin-bottom: 4px; }
.risk-card { background: #1a1015; border-left: 3px solid #ef4444; padding: 10px 14px; margin-bottom: 6px; border-radius: 0 4px 4px 0; font-size: 12px; }
.ai-card { background: #0f1f1a; border-left: 3px solid #22d3ee; padding: 10px 14px; margin-bottom: 6px; border-radius: 0 4px 4px 0; font-size: 12px; }
.ai-card .ai-title { font-weight: 600; color: #67e8f9; margin-bottom: 4px; }
.datasrc { display: inline-block; background: #1e3a8a; color: #bfdbfe; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin: 2px; }

/* ============== PIPELINE VIEW ============== */
.pipeline-container { padding: 32px 48px; max-width: 1400px; margin: 0 auto; }
.pipeline-intro { background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%); padding: 24px 28px; border-radius: 12px; margin-bottom: 32px; }
.pipeline-intro h2 { font-size: 22px; margin-bottom: 8px; color: #f3f4f6; }
.pipeline-intro p { color: #c7d2fe; line-height: 1.7; font-size: 14px; }
.pipeline-overview {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px;
  background: #131825; border-radius: 12px; padding: 16px;
}
.pipeline-overview .step-bubble {
  flex: 1 1 auto; min-width: 160px;
  background: #1e293b; padding: 12px 14px; border-radius: 8px;
  border-left: 4px solid #475569; font-size: 12px;
  position: relative; cursor: pointer; transition: all 0.2s;
}
.pipeline-overview .step-bubble:hover { background: #334155; transform: translateY(-2px); }
.pipeline-overview .step-bubble .sno { font-weight: 700; color: #fbbf24; font-size: 11px; }
.pipeline-overview .step-bubble .stt { font-weight: 700; font-size: 13px; color: #f3f4f6; margin-top: 4px; }
.pipeline-overview .step-bubble .sst { font-size: 11px; color: #9ca3af; margin-top: 2px; }

.module-card {
  background: linear-gradient(135deg, #131825 0%, #1a1f2e 100%);
  border-radius: 12px;
  padding: 24px 28px;
  margin-bottom: 24px;
  border-left: 6px solid;
  position: relative;
}
.module-card .mod-num {
  position: absolute;
  top: -10px; left: 24px;
  background: var(--m-color, #475569);
  color: white;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
}
.module-card h3 { font-size: 22px; color: #f3f4f6; margin-bottom: 4px; margin-top: 8px; }
.module-card .subtitle { font-size: 12px; color: #9ca3af; margin-bottom: 16px; font-style: italic; }
.module-flow { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 16px; margin-bottom: 16px; align-items: start; }
.module-flow .io-box {
  background: #0e1320;
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 12px;
  border: 1px dashed #334155;
}
.module-flow .io-box .label { font-size: 10px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.module-flow .io-box .value { color: #d1d5db; line-height: 1.6; }
.module-flow .io-box.input { border-color: #14532d; }
.module-flow .io-box.input .label { color: #4ade80; }
.module-flow .io-box.output { border-color: #1e3a8a; }
.module-flow .io-box.output .label { color: #93c5fd; }
.module-flow .tasks {
  background: #0e1320;
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.8;
}
.module-flow .tasks .label { font-size: 10px; font-weight: 700; color: #fbbf24; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.module-flow .tasks ol { padding-left: 18px; }
.module-flow .tasks li { color: #e5e7eb; margin-bottom: 4px; }
.module-flow .tasks li b { color: #fde68a; }

.module-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 12px; }
.module-meta > div { background: #0e1320; padding: 10px 14px; border-radius: 6px; }
.module-meta .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.module-meta .tools-box .label { color: #67e8f9; }
.module-meta .blockers-box .label { color: #f87171; }
.module-meta .value { color: #cbd5e1; line-height: 1.6; }

.module-related { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.module-related .relchip {
  background: #1e3a8a;
  color: #bfdbfe;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  cursor: pointer;
}
.module-related .relchip:hover { background: #3b82f6; color: white; }

.flow-connector {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px 0;
  color: #4b5563;
  font-size: 24px;
}

/* Hidden by default */
.view { display: none; }
.view.active { display: block; }
.view.mindmap-view.active { display: grid; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #131825; }
::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #4a5568; }

@media (max-width: 1100px) {
  .container { grid-template-columns: 1fr; height: auto; }
  .case-compare { grid-template-columns: 1fr; }
  .module-flow { grid-template-columns: 1fr; }
}

@media print {
  .header, .tree-panel { display: none; }
  .container, .pipeline-container { display: block; }
}
</style>
</head>

<div class="header">
  <h1>🎯 哈佛团队亚马逊选品策略全景思维导图 v2.0</h1>
  <div class="meta">基于 80+ 份内部材料 + 2026 SOTA 行业基准 · 7 大战略 cluster · 38 个子策略 · 200+ 量化参数 · 11 模块全链路</div>
  <div class="header-controls">
    <div class="tab-switcher">
      <button class="tab-btn active" onclick="switchView('mindmap')">🌳 思维导图</button>
      <button class="tab-btn" onclick="switchView('pipeline')">🔗 全链路视图</button>
    </div>
    <input type="text" id="search" class="search-box" placeholder="🔍 搜索策略 / 参数 / 工具">
    <button class="btn" onclick="expandAll()">全展开</button>
    <button class="btn" onclick="collapseAll()">全收起</button>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot dot-c1"></span>C1 数据</span>
      <span class="legend-item"><span class="legend-dot dot-c2"></span>C2 榜单</span>
      <span class="legend-item"><span class="legend-dot dot-c3"></span>C3 痛点</span>
      <span class="legend-item"><span class="legend-dot dot-c4"></span>C4 品牌</span>
      <span class="legend-item"><span class="legend-dot dot-c5"></span>C5 供应链</span>
      <span class="legend-item"><span class="legend-dot dot-c6"></span>C6 趋势</span>
      <span class="legend-item"><span class="legend-dot dot-c7"></span>C7 AI</span>
    </div>
  </div>
</div>

<div class="view mindmap-view active container" id="view-mindmap">
  <div class="tree-panel" id="tree"></div>
  <div class="detail-panel" id="detail">
    <div class="detail-empty">
      <h2>👈 点击左侧任意策略节点查看详情</h2>

      <p style="margin-top:20px;color:#4b5563;">⌨️ 也可使用顶部搜索框快速定位 · 切换"全链路视图"查看 11 个模块串联关系</p>
    </div>
  </div>
</div>

<div class="view" id="view-pipeline">
  <div class="pipeline-container" id="pipeline-content"></div>
</div>

    "detailedFlow": "亚马逊目前活跃 ASIN 超过 4.5 亿，任何一个新手凭直觉拍脑袋去找品都等同于「在大西洋里捞针」。「工具大数据筛选法」之所以是所有 cluster 里被最先讨论的，原因只有一个：它把\"无限大\"的搜索空间用机器规则压缩到了\"100 个候选 ASIN 池\"。它不解决\"应不应该选某品\"的问题，而是把\"该不该考虑\"的范围合理化——让人和 Agent 都有可咀嚼的输入。\n\n完整流程的设计逻辑是分层漏斗。第一层是类目级筛选（市场容量 / 垄断系数 / 新品占比），目的是把\"红海类目\"和\"死类目\"剔除；第二层是 ASIN 级筛选（BSR / 月销 / 评论数 / 价格带），目的是从健康类目里挑出\"老品压力不大、又有自然需求\"的目标；第三层是 Keepa 二次验证（销量真实性 / 历史曲线 / 断货 / Deal 痕迹），目的是排除被刷出来或被秒杀拉起来的假数据。三层分开是有意为之——把容易出错的\"工具默认数据\"和能够真实复盘的\"历史数据\"切开判断，避免被任何一份单一工具误导。\n\n关键卡点有三个。第一个卡点是市场容量上下界的把握：太小（<$30K）会让单店 ROI 不够、太大（>$1M）会被大牌锁死流量，所以甜区永远是 $30K-$1M 这个区间；第二个卡点是新品占比，因为它直接决定\"新进入者还有没有机会\"——很多人忽略这条，结果一头扎进 2015 年前定型的成熟类目，再多的 spec 创新都打不动；第三个卡点是数据置信度——工具自报销量预估精准度 80-90%，所以\"单工具数据 > 阈值\"绝不能拍板，必须 ≥2 个工具交叉确认，再叠加 Keepa 历史曲线兜底。\n\n哈佛 AI 团队的差异化打法是把这套\"人工跑筛选\"升级为 Discovery Agent 自动 pipeline：每周自动调用卖家精灵 + Helium10 + JS 三个 API，把所有字段融合成 30 维特征向量，再用 XGBoost / LightGBM 在历史成功 / 失败 ASIN 数据上学一个\"新品成功概率\"分类器。比起人工跑数据的最大优势在于：（1）每周可以并行扫 50 个一级类目，比人工的 2-3 个量级多十倍；（2）多工具一致性自动加权，单工具被噪音误导的概率显著下降；（3）失败品自动回流训练集，模型每个季度迭代一次权重，等同于团队的\"工具感觉\"被参数化沉淀下来，不会因为某个分析师离职就丢掉经验。",

  "c3.2": {
    "detailedFlow": "Review Mining LLM 聚类是 C3.1 的工程化升级版本。C3.1 的痛点是抓 5-10 个 ASIN、几百条 review，靠人工归类——这种 scale 在新品启动期够用，但当哈佛要并行处理 100+ ASIN（10,000+ 条 review）的时候人工就完全跑不动了。Review Mining LLM 聚类的存在价值就是把这种\"几万条 review 的语义聚类 + 痛点排序 + spec 蓝图生成\"完全自动化，让一个分析师能跑过去 50 个分析师才能跑出的工作量。\n\n完整流程的设计逻辑是标准的 NLP pipeline 嫁接到选品场景：10K review → text-embedding-3-large embedding → UMAP 降维（n_neighbors=15, min_dist=0.1）→ HDBSCAN 聚类（min_cluster_size=20）→ 每簇 GPT-4o 或 Claude Sonnet 4.6 总结 50 条样本 → 频次 × 情感强度 → 痛点优先级表。其中 UMAP 比 PCA 更适合保留语义局部结构，HDBSCAN 比 KMeans 更适合处理\"自然簇大小不一\"的 review 数据（不需要预先定簇数），GPT-4 / Claude 比 BERT 更善于生成\"一句话标签\"和\"严重度评分\"。这套 pipeline 是 2025-2026 业内 SOTA，SmartScout AI Sentiment、VOC.AI 都用类似架构。\n\n关键卡点有三个。第一是「embedding 模型的语种 / 类目适配」——英文 review 用 text-embedding-3-large 表现极佳，但中文 / 日文 review 上表现差，需要多语言模型（BGE-M3 / E5-mistral）；类目特定的术语（如\"lumen / dBA / mAh\"）通用 embedding 也可能 miss 掉，需要领域微调；第二是「review 真实性」—— 1% 的 review 是刷的（夸赞和恶意差评都有），聚类前要做去噪（删除 verified=false + 异常时间集中爆发 + 重复模板）；第三是「小类目数据稀疏问题」—— review 总数 < 1,000 时聚类效果差，这时候哈佛的\"跨类目 embedding 共享空间\"就是杀手锏：让\"宠物水盆防漏\"的痛点能直接匹配到\"人类水杯防漏\"，做痛点迁移。\n\n哈佛 AI 团队的差异化打法有三层。第一层是行业 SOTA 实现的标准 pipeline（前面那套）；第二层是哈佛真正的差异化——跨类目 embedding 共享空间，让 cluster 之间的痛点可以迁移。这意味着选一个新类目时不必从零开始 mining，可以直接调用历史几百个类目的 embedding 库做\"语义最近邻搜索\"，预判这个类目大概率会有什么痛点 → 起步就是别人的终点。第三层是多模态：把 review 的截图（防漏图、破损图）也做 embedding，文本 + 图片联合 mining。一张\"包装到货时塌成一片\"的图比 100 条文字描述都直接，多模态 embedding 能在文本聚类找不到的位置自动识别这类视觉痛点。预期效果：覆盖度提升 30%，假阳率（虚假改造方向）下降 50%。",

  "c3.3": {
    "detailedFlow": "MVP 7 步迭代的存在价值在于把\"产品开发\"从一种\"老板拍脑袋 / 抄同行 / 磕参数\"的工匠式手工活，升级为有可复用方法论的工程化过程。亚马逊选品最大的浪费不是工厂出货费用，而是\"团队花 3 个月开发一款没人要的产品\"——这种浪费在硬件领域尤其惨烈，因为模具改一次几十万、试错成本远高于互联网产品。MVP 7 步流程的本质就是\"用最低成本最快验证假设，验证失败立刻砍掉，避免黑洞式投入\"。\n\n完整流程的设计逻辑是从模糊到具体的 7 步漏斗。第 1 步机会评估（9 大问题）—— What / Why / Who / How / Market Size / Competition / Edge / Timing / Marketing，这一步用 1-2 天回答\"这事值不值得开始想\"；第 2 步市场调查（6 问）—— 谁用 / 怎么用 / 障碍 / 为何选 / 喜欢什么 / 改进什么，用 1 周做用户访谈；第 3 步产品定义—— 转化为原型文档；第 4 步原型评审—— 多角度评审团（总经理 + 研发 + 市场 + 销售 + 生产 + QA 共 6-8 人），必须 7/8 同意才推进，这是关键卡点；第 5 步 MVP—— 最低成本 + 可行 + 最快放市场（2-4 周）；第 6 步产品验证—— 真实用户测试（1-2 周）通过率 > 60% 才推进；第 7 步产品改进—— 但绝不照单全收用户要求。\n\n关键卡点有四个。第一是「第 6 步通过率 > 60% 是硬门槛」——华为电话语音系统反例：50 个用户测试只有 5 个完成 = 10% 通过 → 项目立刻被否，避免了几千万的后续投入。这种纪律性是绝大多数团队没有的：\"我们已经投了这么多了，再坚持一下也许会好\"——这就是黑洞的开始；第二是「不要照单全收用户要求」——用户说\"我要更便宜\"但实际只要够便宜不亏；用户说\"加个 X 功能\"实际可能根本不用；产品经理必须区分\"用户的解决方案\"和\"用户的真正问题\"；第三是「空白市场陷阱」——完全空白的市场可能不是因为没人做，而是因为没需求；MVP 第 1 步机会评估必须强制回答\"如果这事真的好为什么之前没人做\"；第四是「硬件不能像互联网那样极致迭代」—— 模具改一次几十万、SKU 一次铺 5,000 件，决策错误代价远高于软件，每一步都要扎实。\n\n哈佛 AI 团队的差异化打法是 PM 思维模拟 Agent + 3W1H 强制框架 + KANO 模型评分。PM 思维模拟 Agent 让 LLM 扮演 4-5 种典型用户角色（runner / parent / commuter / home cook / handyman），跑每个场景的用户旅程，自动标出\"凑合 / 将就\"位—— 这种\"凑合位\"就是 spec 改造抓手。3W1H 框架强制每个新品定义阶段回答 What / Why / Who / How 四问，不全的不推进，避免\"模糊概念混进工厂打样\"。KANO + 马斯洛模型把每个产品 spec 打分（基础 / 期望 / 兴奋 / 反向）+ 满足马斯洛哪一层——这能把\"看似差异化但其实是反向需求\"的 spec 提前过滤掉（比如某些\"加 IoT 模块\"的智能化方向，对 90% 用户是反向 spec）。",

    "detailedFlow": "八维差异化矩阵的存在价值在于它给\"差异化方向\"提供了一个穷举式的 brainstorm 框架。新人面对一个种子 ASIN，问\"我该怎么做差异化\"，往往脑子里只能想到 2-3 个方向（颜色不同 / 加一个功能 / 改材质）—— 这种碎片化思考很容易遗漏 70% 的可能空间。八维矩阵强制把思考拆成 8 个独立维度，每个维度生成 5-10 个候选，最后用搜索量 + 竞争度筛选 Top 3，避免\"为差异化而差异化\"的低效改造。\n\n完整流程的设计逻辑是 8 维并行 brainstorm + 多维组合。8 个维度分别是：（1）数量—— 引流款 + 利润款搭配；（2）搭配—— 套装组合（午餐饭盒 + 刀叉 + 保温袋）；（3）材质—— 玻璃 → 硅胶 → 竹子；（4）外观—— 经典款 → Y2K 风；（5）功能 / 特征—— 旅行版 / 一次性版；（6）受众迁移—— 人用 → 宠物用；（7）应用场景—— 节日 / 露营 / 旅行；（8）元素叠加—— + IP / + 卡通 / + 动漫。但核心准则是：单维度差异化不够，至少 2-3 维度组合才能形成有效差异化。比如\"灭鼠先锋 Pop It\"是基础款 → 水果形 → 篮球形 → 月亮形，这是外观维度 + 元素叠加维度的组合；\"狗狗牙刷牙膏\"是受众迁移维度（人 → 宠物）+ 材质维度（人用 PP → 宠物用硅胶）的组合。\n\n关键卡点有三个。第一是「为差异化而差异化的陷阱」—— 不是所有\"不同\"都是好的差异化，必须解决真实痛点。比如\"加 IoT 模块\"看着 cool 但对 90% 用户是反向需求；\"换 7 种花色\"看着丰富但增加库存压力 7 倍。每个差异化方向必须用 C3.1 review mining 的痛点表反向验证—— 这个差异化方向是不是真的解决了 review 里的痛点？第二是「加功能影响整体性能」—— 改 spec 比加 spec 稳。加一个传感器看着小改实际会增加 30% BOM 成本 + 5% 故障率 + 复杂客服流程；改进现有 spec（如把电池从 3000mAh 升级到 5000mAh）则成本可控且确定有效；第三是「2-3 维组合优于单维」—— 单维度差异化太容易被复制（你换个颜色我也换），2-3 维组合形成的 spec 矩阵则护城河更高（材质 × 受众 × 场景三维差异化很难被完全复制）。\n\n哈佛 AI 团队的差异化打法是 8 维 Brainstorm Agent + 2D-MIX Agent。8 维 Brainstorm Agent 输入种子 ASIN URL → LLM 自动跑 8 维度 → 每维度生成 5-10 候选改造 → 用 Helium10 反查每个候选的搜索量、竞争度 → 输出\"差异化雷达图\"。这能让人脑想不到的方向被自动覆盖（比如\"加上 IP × 节日场景 × 礼盒包装\"三维组合，人脑很难自动想到这种组合，但 LLM 可以暴力枚举）。2D-MIX Agent 自动枚举所有 2 维组合 = 8×7/2 = 28 个组合，优先级用关键词蓝海度排序，每个组合查 ABA 月搜索量 + 竞争度后输出\"差异化机会矩阵\"。",

    "detailedFlow": "复购属性筛选要解决的是\"流量越来越贵、CAC 越来越高\"的根本问题。2020 年亚马逊 CAC 大约 $8，到 2026 年涨到 $25-35，独立站 CAC 更狠，从 $15 涨到 $60+。如果产品是一次性的（如行李箱、瑜伽垫），就意味着每卖一单都要全额承担 CAC，毛利再高也撑不住。复购属性筛选的哲学是：在选品阶段就把\"是否有自然复购通路\"放进必选项，让单个用户在 12 个月内贡献 2-5 次订单，LTV/CAC 从 1:1 拉到 3:1 甚至 5:1。\n\n完整流程的设计逻辑分三层判断。第一层问\"是不是消耗品\"——益生菌、咖啡豆、宠物零食、剃须刀片、洗发水都是天然消耗品，用完就需要复购，这是最强的复购信号。第二层问\"消耗周期多长\"——3 个月以内是强复购（用户没忘记你之前就回来了），3-6 个月是中复购（需要邮件/订阅提醒），6 个月以上接近一次性（如床单、被套）。第三层问\"能不能套订阅模式（Subscribe & Save）\"——亚马逊的 S&S 渗透率到 2026 年已达 30%+，订阅用户的 LTV/CAC 是非订阅的 2-3 倍，因为获取一次就锁定 12 个月。\n\n关键卡点：(1) 消耗周期估算不能拍脑袋，必须用\"日均使用频次 × 每次用量 ÷ 包装量\"算出来，再用真实用户调研校准——很多卖家拿 30 天瓶装当强复购，结果用户实际 60 天才用完，复购周期翻倍直接拉垮现金流模型；(2) 认证类消耗品（食品/补剂/美妆/儿童用品）虽然复购属性极强，但 FDA/FSC/EPA 认证门槛极高，新手切入容易踩雷；(3) 物流损耗——液体、易碎、温控类消耗品退货率 12-18%，比硬货高 3 倍，毛利会被吃掉一大块；(4) Subscribe & Save 折扣定价——折扣太低（< 5%）用户不愿订，太高（> 15%）毛利崩盘，10% 是大多数 DTC 的甜区。\n\n哈佛 AI 团队的打法：先用 Yotpo 2026 复购率数据库 + Statista 类目报告做\"高复购属性品类\"白名单（益生菌、宠物消耗、男士护理、咖啡、个护、烘焙原料、办公耗材），再用 LLM Agent 自动估算每个候选产品的消耗周期。Agent 还会模拟 5%/10%/15% 三档 S&S 折扣对 LTV 的影响曲线，找到边际收益最高点。最后用一个 Risk Filter 把需要 FDA 注册、含锂电、含磁铁等高门槛产品标红警告，避免新手团队踩坑。",

    "detailedFlow": "三位一体是 2024 年后 DTC 品牌存活的必要架构，不再是可选项。原因是：亚马逊给你流量但不给你用户数据（连用户邮箱都不给），独立站让你拥有用户但前 6 个月几乎不可能盈利，社媒能造势但流量留不住。任何单一渠道都死路一条——纯亚马逊品牌一旦被对手低价围攻就崩盘（参见 2024 年大量 7 位数月销的品牌闪崩），纯独立站品牌投不起 Facebook Ads 的高 CAC，纯社媒品牌带货 ROI 永远算不过来。三位一体让三个渠道各司其职、互相输血。\n\n完整流程的设计逻辑是给三个渠道分配不同 KPI：(1) 亚马逊 = 现金流引擎，做销售额、ACoS、转化率，不指望它做品牌；(2) 独立站 = 品牌资产引擎，做 LTV、NPS、订阅渗透率，可以接受前 6 个月 ROI 为负；(3) 社媒（Reels/TikTok/YouTube Shorts）= 发现层 + UGC，做播放量、CTR 到独立站，不直接卖货。亚马逊给社媒提供素材（用户评论、A+ 图）、给独立站做品牌背书；独立站把高 LTV 用户用邮件培养出来，再用品牌资产反推亚马逊关键词搜索量；社媒给两边都提供\"发现层\"流量，吸引那些还不知道你品牌的用户。\n\n关键卡点：(1) Reels/TikTok 视频转化率必须 > 1% 才有意义，< 0.5% 基本是无效素材，需要重新换 hook；(2) 独立站 vs 亚马逊毛利差——独立站如果不比亚马逊多 10% 毛利，就没必要单独维护，因为获客成本会吃掉差额；(3) 社媒 → 独立站 CTR 要 > 2%，否则证明视频和落地页脱节，用户点进来发现不是想要的就跳出；(4) 跨平台归因——这是最难的，没有 Shopify Pixel + UTM 配合，根本不知道哪个视频带来了哪个订单，钱都白烧。\n\n哈佛 AI 团队的打法是构建一个 Cross-Platform Orchestrator Agent：1 个种子产品视频 → LLM + AI 视频工具（Runway / Sora）自动剪 5-10 个不同 hook 的版本 → 同时投 Reels / TikTok / YouTube Shorts，每个平台带不同 UTM；用 Shopify Pixel + Triple Whale 做跨平台归因，自动算出每条视频的真实 ROAS；亚马逊 ABA 数据反过来告诉社媒\"这周哪些关键词搜索量飙升\"，社媒立刻造 UGC 内容跟上。这套打法让 Anker 的社媒发现层成本从 $20 CAC 压到 $7，独立站订阅渗透率从 5% 拉到 22%。",

  "c4.4": {
    "detailedFlow": "Hero SKU + Lean Launch 是反人性的策略。中国卖家最大的执念就是\"我有 10 个候选产品都不错，都做了再看哪个爆\"，结果资源被 10 等分，每个 SKU 都不够预算推广，最终 10 个都做不起来。Lean Launch 来自硅谷创业方法论：先做一个 MVP，跑出 PMF（Product-Market Fit）后再扩，PMF 之前任何扩张都是浪费。Hero SKU 的核心定义是\"这一款产品本身就能撑起一个品牌叙事\"，比如 Anker 的第一款充电器、Bombas 的第一款踝袜、Dr. Squatch 的第一款黑松木肥皂——每个都是一款产品撑住整个品牌 12-18 个月，跑通了才上 Sidekick。\n\n完整流程的设计逻辑：第一步选 1 个 Hero SKU，候选池可以有 5-10 个，但实际投入资源的只能 1 个；第二步首批备货 30-100 件——刻意压低，因为这一阶段是测试不是 scale，备多了砸手里，备少了刚好用 Vine 跑出种子评论；第三步用 Vine + 自然流量跑 1-2 个月，看月销能不能破 200；第四步如果月销过线，跑 Sean Ellis PMF 测试：\"如果失去这个产品你会失望吗？\"，失望率 > 40% 才算 PMF；第五步达成 PMF 后才开始 Sidekick 矩阵扩张。整个过程要求团队克制——这是最难的。\n\n关键卡点：(1) Sean Ellis PMF 失望率 < 40% = 没有 PMF，扩 Sidekick 就是自杀，但 90% 卖家会自欺欺人觉得\"再等等会好\"；(2) Hero SKU 试销期 < 1 个月就放弃 = 太着急，亚马逊新品需要 60 天才能稳定排名；(3) 试销期 > 6 个月还不破 100 单 = 太慢，大概率是产品本身有问题应该换；(4) 第一年 SKU 数 > 5 = 资源分散，几乎注定 5 个都做不起来。Anker 第一款充电器跑到月销 50,000 才开始上 Sidekick，Bombas 单 SKU 跑了 18 个月才上第二款——这是冠军级耐心。\n\n哈佛 AI 团队的打法是构建一个 Hero SKU Priority Agent：输入 5-10 个候选品 → 综合打分（市场 × 利润 × 品牌契合度 × 供应链可行性 × 团队经验匹配度）→ 输出\"应该先做哪个\"。再接一个 PMF Monitor Agent，每周自动跑 Sean Ellis 调研（用邮件+短信发问卷）、NPS 调研，自动算分。如果失望率连续 4 周 < 30%，Agent 自动建议\"换品\"；如果 > 40% 持续 4 周，Agent 自动建议\"开始扩 Sidekick\"。这套机制把人类常犯的\"舍不得放弃 + 自欺欺人\"问题用数据强制纠正。",

  "c4.5": {
    "detailedFlow": "新品成长飞轮是亚马逊官方在 2024-2025 年推出的方法论，把过去散乱的\"选品→开发→运营\"流程系统化为 7 个环节、2 个阶段的闭环。它的存在意义是把整个新品生命周期当成一个工业化流水线来管理——以前是\"凭感觉\"，现在用数据驱动每个环节，每个环节都有明确 KPI 和工具支持。亚马逊推这套方法论的根本原因是：他们发现 80% 的新品在前 90 天就死掉，主要原因不是产品差，而是某个环节脱节（比如设计没考虑物流尺寸、备货周期算错、冷启动节奏错乱）。\n\n完整流程的设计逻辑：7 个环节是 (1) 创意概念 → (2) 设计开发 → (3) 供应链生产 → (4) 物流 → (5) 投放市场 → (6) 效益最大化 → (7) 产品迭代，环节 1-4 是\"开发阶段\"，5-7 是\"运营阶段\"。每个环节都对应亚马逊官方 4 工具：商机探测器 OX（找细分赛道）、选品指南针 MPG（验证细分品类）、增长机会 MYG（找拓展空间）、品牌分析 ABA（关键词搜索量）。最关键的设计是引入两个量化公式：(1) 特征词搜索热度 = (1 / 搜索频率排名) × 100,000，把抽象的关键词热度变成可比的数字；(2) 特定搜索词出单预估 = 商品点击数 × 搜索转化率，把\"这个关键词能给我带多少单\"变成可计算。\n\n关键卡点：(1) 朝阳市场判定——\"新品占比 > 30%\"是关键信号，意味着这个市场每月有新玩家进来跑出销量，机会窗口还开着；< 10% 说明被老链接垄断，新人进去打不动；(2) Top 5 商品点击份额——< 30% 才是分散市场新人有机会，> 50% 是垄断市场新人不要碰；(3) 退货率分级——≥ 15% 是红线品类，亚马逊会直接限制新品成长；(4) 备货库存周期 2-3 月是甜区，少了断货毁排名，多了资金占用。\n\n哈佛 AI 团队的打法是用 4 个亚马逊工具的 API 数据自动化拉取，构建一个 Funnel Agent：OX 拉细分赛道清单 → MPG 验证每个细分的市场容量 → MYG 标注拓展机会 → ABA 拉关键词搜索量。Agent 自动算出每个候选品类的\"特征词搜索热度\"和\"出单预估\"，按朝阳市场判定 + Top 5 点击份额 + 退货率三维度打分，输出推荐清单。再用 fall lights（秋季灯）案例的时间线模板自动化项目管理：5/25 之前完成调研开发、5/25 小批量空运、6/15 上架冷启动、7/1 进入旺季——所有节点 Agent 自动排期并提醒。",

    "detailedFlow": "1688 产业带反查是中国卖家最大的护城河战术，西方 DTC 品牌几乎不可能复制。哲学背景是：亚马逊上的产品大部分本质都来自中国工厂，与其在亚马逊上看到爆款再回 1688 找货源（这时利润已经被前面的卖家吃了 80%），不如反过来——直接从 1688 产业带源头找\"还没被亚马逊化的工厂能力\"，再去亚马逊验证机会。义乌做小商品、广东做 3C 数码、深圳做跨境配件、宁波做家居用品、汕头做玩具、东莞做电子——每个产业带都有几千家工厂，其中只有 5-10% 上了亚马逊，剩下 90% 还在做内贸或欧洲传统外贸，是供应链反推的金矿。\n\n完整流程的设计逻辑：第一步选定一个你熟悉的产业带（团队成员有工厂关系最好），第二步在 1688 用核心关键词搜（如\"plant stand 植物支架\"），第三步筛选月销 1000+ 的工厂（证明产品已经被市场验证），第四步把这些工厂的产品名/图反查到亚马逊（用图片搜索 + 关键词翻译），第五步在亚马逊验证 BSR/月销/价格，第六步算价差倍数——如果 1688 ¥10 → 亚马逊 $20 = 14 倍价差，毛利足够覆盖物流+广告+佣金；如果价差 < 3 倍则不要做（毛利不够覆盖成本）。最后才进入谈判+下单流程。\n\n关键卡点：(1) 价差倍数——< 3× 几乎不可能盈利（FBA 头程+佣金+广告+退货就吃掉 60%），3-5× 是底线，5-8× 是健康甜区，8-15× 是极优区；(2) 工厂起订量——首单 > 5000 件是红线（资金锁死），500-2000 健康，100-500 极优（适合试单）；(3) 工厂是否用自有图片——如果工厂用通用图片（多家工厂用同一张图），证明这是\"公模\"产品，亚马逊上已经有几十个卖家在卖，不要碰；(4) 专利风险——1688 上很多产品本身就侵权（特别是欧美设计专利），下单前必须做 FTO（Freedom To Operate）检索，否则上架后被亚马逊下架 listing 资金全套牢。\n\n哈佛 AI 团队的打法是构建一个 1688 反查 Agent：用爬虫抓产业带分类 Top 工厂 → LLM 翻译产品名/规格 → 用 Google Lens 或 Helium10 图片搜索反查 Amazon listing → 自动算价差倍数 + 月销 + 入场难度 → 输出打分卡。DeepSeek 早期发过\"plant stand\"完整案例代码，团队可以直接复用。还要叠加一个 FTO Agent：每个候选产品自动检索 USPTO 设计专利数据库，标红可能侵权的设计元素，避免\"图便宜下单 500 件，上架 3 天被投诉下架\"的灾难。实战中\"植物支架 plant stand\"案例最终把采购成本压到亚马逊售价的 25-40%，验证了产业带反推的可行性。",

    "detailedFlow": "首批采购量公式是 C4.5 飞轮中提到的核心公式，单独拆出来讲是因为它是\"备货决策\"的唯一科学方法。中国卖家最大的两个死法都跟备货有关：(1) 备少了断货——亚马逊新品扶持期断货一次，\"新品标\"立刻消失，自然排名暴跌，再补货也救不回来；(2) 备多了积压——资金被库存锁死，无法投广告，现金流断裂被迫低价清仓。这两个错误每年让 30%+ 的新品死掉。首批采购量公式的存在意义是把\"凭感觉拍脑袋\"换成\"按公式精确计算\"，把死亡率从 30% 降到 < 5%。\n\n公式本体：**首批采购量 = (采购周期 + 入库天数) × (备货天数 × 日均销量 / 30)**。公式的设计逻辑是把\"补货周期\"和\"目标库存周期\"两个独立变量乘起来：补货周期 = 采购周期 + 入库天数（从下单到 FBA 在售要多久），目标库存周期 = 备货天数 × 日均销量（要保持几天的销售库存）。具体例子：采购周期 30 天（普货）+ 海运入库 15 天 = 45 天补货周期；备货 60 天 × 日均 10 单 = 600 单/月（目标库存）→ 首批 = 45 × (60 × 10 / 30) = 45 × 20 = **900 单**。这 900 单的含义是：从你下单到下一批货到 FBA 需要 45 天，期间要能持续供应 60 天销量。\n\n完整流程的设计逻辑：第一步估算采购周期——普货 20-30 天，带电/私模 45-60 天；第二步选物流方式——海运 30-45 天慢但便宜（单位 $1-2/lb），空运 7-15 天快但贵（单位 $4-7/lb）；第三步设置备货天数——60-90 天是标准，旺季前要拉到 90 天；第四步预估日均销量——这是最容易拍脑袋的环节，必须用同类产品 Top 30 BSR 的销量数据 / 1.5（保守估计）；第五步乘以安全库存乘数 1.2-1.5（覆盖突发需求 / 物流延误）。\n\n关键卡点：(1) 日均销量预估——80% 卖家高估自己的销量，乐观估 50 单/天实际跑 15 单/天，结果备货严重过量；(2) 采购周期被低估——带电产品 / 私模 / 需要质检的产品周期 45-60 天，不是普货的 25 天，新手常常按普货算；(3) 入库天数被忽略——海运 30-45 天是常态，但很多卖家只算 15 天，结果到 FBA 时间晚一倍；(4) 安全库存乘数——理论上 1.2× 够，但 Q4 旺季要 1.5×，新品冷启动要 1.3×。\n\n哈佛 AI 团队的打法：构建库存 Agent，实时监控 FBA 在库 + 在途库存 + 销售速度，每天自动计算\"还能撑几天\"和\"什么时候应该下下一批\"，提前 30 天触发补货 trigger 避免断货。日均销量预估 Agent 用同类 BSR 数据 + 关键词搜索量 + 季节性曲线，给出三档预估（保守 / 中性 / 激进），强制用户选择中性档（避免人类的乐观偏见）。补货决策最终签字前 Agent 强制弹出\"如果实际销量只有预估 50%，你的库存会撑 N 个月，资金占用 ¥X\"的风险提示，让卖家在拍板前看到最坏情况。",

    "detailedFlow": "精铺 vs 精品双模式分流的存在意义是把\"团队资源 + 供应链能力\"作为前置约束，倒逼团队选择适合自己的运营模式，而不是盲目模仿别人。这是中国跨境圈最被忽视的元决策——很多团队明明只有 $30K 启动资金 + 0 工厂关系，却硬要学 Anker 走精品全私模路线，结果第一年烧光资金；反之，有 $300K + 强供应链关系的团队却跑去做精铺铺货，浪费了能做品牌的核心优势。两个模式没有优劣，只有匹不匹配团队。\n\n完整流程的设计逻辑：先评估两个核心维度——资金（< $50K / $50K-$200K / > $200K）和供应链能力（无工厂关系 / 部分供应链 / 强供应链），交叉出三个推荐模式：(1) 精铺模式（资金 < $50K + 无工厂关系）——公模微改、SKU 8-12、开发周期 < 1 个月、利润率 20-30%；(2) 半精品（$50K-$200K + 部分供应链）——半 ODM、SKU 3-5、开发周期 1-3 月、利润率 30-40%；(3) 精品（> $200K + 强供应链）——全 ODM + 私模、SKU 1-3、开发周期 3-6 月、利润率 40%+。三个模式对应完全不同的能力栈：精铺要的是 SKU 管理 + 广告效率，精品要的是产品研发 + 品牌叙事。\n\n关键卡点：(1) 精铺最大的陷阱是\"看起来低门槛实际高难度\"——8-12 个 SKU 同时管理，库存周转/广告分配/listing 维护的复杂度是单 SKU 的 5 倍以上，没经验的团队铺下去全部变僵尸链接；(2) 精品最大的陷阱是\"看起来高利润实际高风险\"——单 SKU $30K+ 投入，一旦选品失败就 100% 全损，没有 Plan B；(3) 半精品看起来折衷其实最难——既要管 3-5 个 SKU 又要做半 ODM，对团队能力要求最高（既要 SKU 管理能力又要产品研发能力）；(4) 退出难度差异巨大——精铺退出难度低（公模货可以折价清掉），精品退出难度极高（已投模具 + 私模库存几乎无残值）。\n\n哈佛 AI 团队的打法：构建资源评估 Agent，自动问 5 个团队问题——可用资金、供应链关系、过往跨境经验、风险偏好、可投入时间——输出推荐模式 + 风险提示。再叠加一个 Mode Switch Monitor Agent，监控团队实际跑下来的关键指标（库存周转 / 毛利率 / SKU 健康度），如果跑了 6 个月发现实际指标偏向另一个模式（如选了精品但只跑出 25% 毛利、说明应该转半精品），Agent 自动建议\"模式切换\"。最关键的是 Agent 会主动反对\"过度乐观\"——团队说自己有\"强供应链\"时 Agent 会追问\"你能拿到 MOQ 300 的私模吗\"\"你认识 3 家不同产业带的工厂老板吗\"，逼出真实情况。",

    "detailedFlow": "**1. 策略哲学背景**\nLLM Agent 自动 Pipeline 是哈佛 AI 团队 MVP 的核心 demo——用一个 7 步全自动选品流程，把传统选品团队 8 周的工作压缩到 48 小时。DeepSeek / Claude / GPT-4o 在 2025-2026 的能力已经足够支撑这种 pipeline，但行业内绝大多数卖家仍然在手动跑这 7 步，每步之间靠人工传递 Excel 文件——这就是哈佛团队的工程效率护城河。但必须警惕\"AI 幻觉\"风险：DeepSeek 等 LLM 会编造数据（比如虚构某个 ASIN 的销量），所有 LLM 输出必须用真实工具 API（卖家精灵 / Helium 10 / SmartScout）校验。\n\n**2. 流程每步为什么这么走（每步 prompt 设计建议）**\n\n**第 1 步：选市场（LLM 给 4 候选类目）**\nPrompt 设计要点：明确启动资金（$50K）+ 团队能力 + 目标毛利率 → 强制 LLM 输出 JSON 格式（category / reason / market_size / competition_level / risk_score），不允许自由文本。范例 prompt: \"你是亚马逊选品专家。给定预算 $50K、团队 3 人、目标毛利 30%+，请推荐 4 个适合切入的 Amazon 类目，输出 JSON: [{category, reason, market_size_M, competition_1_to_10, risk_1_to_10, why_now}]\"。\n\n**第 2 步：选产品（LLM 给 20 候选品）**\nPrompt 设计：在第 1 步输出的类目下，要求 LLM 给出 20 个具体产品候选，每个产品必须包含子类目 + 价格区间 + 月销量估算 + 主要痛点。注意：LLM 给出的销量数据 100% 是猜测的，必须在第 3 步用真实工具校验。\n\n**第 3 步：关键词验证（卖家精灵反查）**\n这一步必须用真实 API，不能用 LLM 猜测。把第 2 步的 20 个候选品的关键词喂给卖家精灵 API，获取真实搜索量 / 竞争度 / CPC，剔除搜索量 < 3000 或 > 30000 的产品（红线规则），保留 8-10 个。Prompt 不直接用，而是用代码调 API。\n\n**第 4 步：数据下钻（导出 Excel 分析）**\n这一步把第 3 步剩余的 8-10 个产品用 Helium 10 / SmartScout 拉取完整数据（top 30 ASIN 的销量 / 评分 / 评论数 / Listing Age），导出 Excel。Prompt 设计：让 LLM 读取 Excel 后输出\"每个产品的市场结构分析\"，强制要求引用具体数字（如\"Top 1 ASIN 月销 1800 单，BSR 3200，但有 8500 review，新品切入难度高\"）。\n\n**第 5 步：评价分析（LLM 提取痛点）**\n对剩余 5-6 个候选品，每个抓取 500-1000 条 review，喂给 LLM 做痛点提取。Prompt 设计：强制 LLM 输出 JSON 格式 \"[{pain_point, frequency_percent, severity_1_to_5, example_quote, possible_solution}]\"，禁止自由文本。注意：要求 LLM 引用 review 原文（example_quote），避免幻觉。\n\n**第 6 步：供应链挖掘（1688 + LLM 谈判策略）**\n对剩余 3-4 个候选品在 1688 / Alibaba 上找供应商，LLM 输出\"谈判策略 + 起订量建议 + 质量风险点\"。Prompt: \"给定产品 X，1688 上有 50 家供应商，价格区间 $3-$8/件，请你以亚马逊卖家身份给出谈判策略 + 起订量建议 + 3 个必检的质量风险点\"。\n\n**第 7 步：经营预测（6 月销量 / 利润 / 风险）**\n对剩余 1-2 个 final 候选品，LLM 输出 6 个月经营预测，包含月销量曲线 / 月毛利 / ACoS 预估 / 现金流模拟。Prompt: \"给定产品 X 售价 $25、成本 $7、FBA $4，请预测 6 月月销量 / 月毛利 / 现金流 / 关键风险\"。强制要求列出 3 个量化风险（如\"30 天断货风险 25%\"）。\n\n**3. 关键卡点**\n最致命的卡点是「AI 幻觉」——LLM 会编造具体的 ASIN 编号、销量、价格，盲信会导致严重错误。所有 LLM 输出的\"具体数字\"必须用真实工具校验。第二个卡点是「prompt 不稳定」——同一个 prompt 不同时间跑可能输出不同结果，需要 prompt 工程化（用 temperature=0 + JSON schema 强制约束）。第三个卡点是「7 步之间的数据传递」——每一步输出必须结构化（JSON / Excel），不能是自由文本，否则下一步 LLM 无法稳定消费。\n\n**4. 哈佛 AI 团队怎么做得更好（DeepSeek 园艺工具 → 植物支架完整案例）**\n我们已经跑通过一个完整案例：DeepSeek 第 1 步推荐\"园艺工具\"类目 → 第 2 步给出 20 个园艺工具候选 → 第 3 步卖家精灵筛出\"植物支架\"（搜索量 9500，竞争中等）→ 第 4 步 Helium 10 下钻 Trellises 子类目（Top ASIN 月销 5133、4.4 评分、新品占比 12%）→ 第 5 步 review 痛点提取（\"不够结实\"、\"安装复杂\"、\"塑料质感差\" 3 大痛点）→ 第 6 步 1688 找到 1 家工厂控本（采购成本 25% 售价）→ 第 7 步预测 6 月销量 300-1500 单 / 月、毛利 30-35%、ACoS 18-22%。整个流程 48 小时跑完，传统团队要 8 周。这就是哈佛 MVP 的核心证明。",

  "c7.5": {
    "detailedFlow": "**1. 策略哲学背景**\n跨类目痛点迁移是哈佛 AI 团队的护城河 #2，也是真正的 alpha 方向——业内 SOTA 工具（VOC.AI / SmartScout / Helium 10）都在同一类目内做 review 分析，没有任何一家做跨类目痛点迁移。但消费者的痛点是跨类目共通的——\"防漏\"是宠物水盆、人类水杯、户外水壶、儿童保温瓶共同的痛点；\"耐摔\"是相机、手机壳、儿童产品、户外装备的共同痛点。如果能在类目 X 中识别\"已被某品牌成功解决的痛点\"，再在类目 Y 中找到\"该痛点仍存在且未被解决\"的市场空间，就能用类目 X 的成熟解决方案降维打击类目 Y。哈佛团队天然具备多类目 embedding 共享空间的 ML 能力，这是 2-3 年行业 SOTA 都赶不上的方向。\n\n**2. 流程每步为什么这么走**\n为什么必须用 embedding 而非关键词匹配？因为\"防漏\"在不同类目用词完全不同——宠物水盆叫 \"no-spill\"、人类水杯叫 \"leak-proof\"、户外水壶叫 \"spill-resistant\"、儿童保温瓶叫 \"anti-leak\"——关键词匹配会全部漏掉，但在 embedding 空间中这些词的语义距离 < 0.15，是同一痛点的不同表达。决策链路里\"近似度 > 0.85\" 是迁移线——< 0.85 意味着两个类目的痛点本质不同（如宠物水盆的\"防漏\"可能是\"防地面溅水\"而水杯的\"防漏\"是\"防口袋渗水\"），强行迁移会失败。迁移成功后还要评估目标类目 Y 的市场空间——如果 Y 类目本身就饱和（Page-1 平均 review > 5000），即便有解决方案也吃不到红利。\n\n**3. 关键卡点**\n最致命的卡点是「embedding 空间训练」——通用 BGE-M3 模型在跨类目 review 上的表现不够好，需要在 Amazon review 数据上做 contrastive fine-tuning，让\"同一痛点不同类目的表达\"在 embedding 空间中靠近，让\"不同痛点同一类目的表达\"远离。这是哈佛 ML 团队的核心技术活，至少需要 3-6 个月工程。第二个卡点是「迁移可行性的因果判断」——A 类目的解决方案能在 B 类目奏效，不仅需要痛点相同，还需要\"技术原理可迁移\"。比如宠物水盆的\"防漏\"解决方案是\"加重底盘 + 内置防溅圈\"，迁移到人类水杯需要重新设计（人类水杯不能加重底盘），需要 LLM 做\"解决方案技术原理评估\"。第三个卡点是「目标类目市场验证」——找到迁移机会后还要验证 Y 类目本身有需求，不能是\"想象的需求\"。\n\n**4. 哈佛 AI 团队怎么做得更好（窗口期 18-24 月的紧迫性 + 真正的 alpha）**\n为什么这是真正的 alpha？因为：①工具门槛极高——需要训练专门的跨类目共享 embedding 空间，需要 ML 团队 + 至少 10 个类目的 review 数据（哈佛团队的数据资产 + ML 能力都具备）；②认知门槛极高——大多数卖家根本意识不到\"宠物水盆的解决方案能用在人类水杯上\"，这是反直觉的迁移路径；③窗口期短——2026-2028 年是绝对蓝海，等其他工具开始做后红利消失。我们的工程实现：①收集 Amazon 全类目 review 数据（至少 100 个类目，每类目 100K+ review）；②用 BGE-M3 + contrastive learning 训练\"痛点共享 embedding 空间\"，让语义相近的痛点在向量空间中聚集；③构建\"成功解决方案库\"——把每个类目中\"4.5+ 评分 + 1000+ review\"的 listing 标注为\"已解决该痛点的成功案例\"；④跨类目匹配 Agent——输入候选类目 Y，自动在所有其他类目中检索\"已解决 Y 类目仍存在的痛点\"的成功案例；⑤迁移可行性评估——用 LLM 评估解决方案的技术原理是否可迁移。这套系统跑通后，每周能产出 5-10 个跨类目迁移机会，是单类目分析方法的 20× 信息密度。",

// ========== 渲染：思维导图 ==========
function renderTree() {
  const tree = document.getElementById('tree');
  let html = '';
  Object.keys(DATA).forEach(cKey => {
    const c = DATA[cKey];
    html += '<div class="cluster" data-cluster="' + cKey + '">';
    html += '<div class="cluster-header c-' + c.color + '" onclick="toggleCluster(\'' + cKey + '\')">';
    html += '<span class="toggle">▼</span><span>' + c.title + '</span></div>';
    html += '<div class="cluster-body">';
    Object.keys(c.children).forEach(lKey => {
      const l2 = c.children[lKey];
      html += '<div class="l2-node" data-id="' + lKey + '" onclick="showDetail(\'' + cKey + '\',\'' + lKey + '\')">';
      html += '<span class="legend-dot dot-' + c.dot + '" style="width:6px;height:6px;"></span>';
      html += '<span>' + l2.title + '</span></div>';
    });
    html += '</div></div>';
  });
  tree.innerHTML = html;
}

function toggleCluster(cKey) {
  document.querySelector('[data-cluster="' + cKey + '"]').classList.toggle('collapsed');
}
function expandAll() { document.querySelectorAll('.cluster').forEach(el => el.classList.remove('collapsed')); }
function collapseAll() { document.querySelectorAll('.cluster').forEach(el => el.classList.add('collapsed')); }

function showDetail(cKey, lKey) {
  document.querySelectorAll('.l2-node').forEach(el => el.classList.remove('active'));
  const node = document.querySelector('[data-id="' + lKey + '"]');
  if (node) node.classList.add('active');

  const c = DATA[cKey];
  const l2 = c.children[lKey];
  const ext = (typeof EXTENSIONS !== 'undefined') ? EXTENSIONS[lKey] : null;
  let html = '';

  html += '<div class="detail-header">';
  html += '<div class="detail-breadcrumb">' + c.title + '</div>';
  html += '<div class="detail-title">' + l2.title + '</div>';
  if (l2.trigger) html += '<div class="detail-philosophy">🎯 ' + l2.trigger + '</div>';
  html += '</div>';

  // NEW: detailedFlow (详细叙述)
  if (ext && ext.detailedFlow) {
    html += '<div class="section"><div class="section-title"><span class="icon">📖</span>策略详细叙述 (Why & How)</div>';
    html += '<div class="narrative">' + escapeHtml(ext.detailedFlow).replace(/\n\n/g, '</p><p>').replace(/^/, '<p>').replace(/$/, '</p>').replace(/\n/g, '<br/>') + '</div></div>';
  }

  if (l2.datasrc) {
    html += '<div class="section"><div class="section-title"><span class="icon">📊</span>数据源 (Data Sources)</div><div class="section-body">';
    l2.datasrc.forEach(d => html += '<span class="datasrc">' + d + '</span>');
    if (l2.datasrcDetail) html += '<p style="margin-top:10px;color:#9ca3af;font-size:12px;">' + l2.datasrcDetail + '</p>';
    html += '</div></div>';
  }

  if (l2.pipeline) {
    html += '<div class="section"><div class="section-title"><span class="icon">🔄</span>决策链路 (Pipeline)</div><div class="section-body"><div style="display:flex;flex-wrap:wrap;gap:8px;">';
    l2.pipeline.forEach(p => html += '<div class="pipeline-step">' + p + '</div>');
    html += '</div></div></div>';
  }

  // 参数总表（旧的，简略版）
  if (l2.params && l2.params.length) {
    html += '<div class="section"><div class="section-title"><span class="icon">📐</span>关键参数速览表</div>';
    html += '<table class="params-table"><thead><tr><th>参数</th><th>红线</th><th>健康区</th><th>极优区</th><th>置信</th><th>来源</th></tr></thead><tbody>';
    l2.params.forEach(p => {
      const conf = p[4] === 'high' ? 'conf-high' : (p[4] === 'mid' ? 'conf-mid' : 'conf-low');
      const confTxt = p[4] === 'high' ? '🟢' : (p[4] === 'mid' ? '🟡' : '🔴');
      html += '<tr><td><b>' + p[0] + '</b></td><td class="red">' + p[1] + '</td><td class="yellow">' + p[2] + '</td><td class="green">' + p[3] + '</td><td><span class="conf ' + conf + '">' + confTxt + '</span></td><td><span class="source-tag">' + p[5] + '</span></td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // NEW: 参数深度解读
  if (ext && ext.paramExplain && ext.paramExplain.length) {
    html += '<div class="section"><div class="section-title"><span class="icon">🔬</span>参数深度解读：含义 · 为什么用 · 高低意义 · 数字例子</div>';
    html += '<div class="param-grid">';
    ext.paramExplain.forEach(pr => {
      html += '<div class="param-card">';
      html += '<div class="pname">' + escapeHtml(pr.name) + '</div>';
      if (pr.what) html += '<div class="param-row"><span class="label label-what">是什么</span><div class="value">' + escapeHtml(pr.what) + '</div></div>';
      if (pr.why) html += '<div class="param-row"><span class="label label-why">为什么</span><div class="value">' + escapeHtml(pr.why) + '</div></div>';
      if (pr.high) html += '<div class="param-row"><span class="label label-high">高 ↑</span><div class="value">' + escapeHtml(pr.high) + '</div></div>';
      if (pr.low) html += '<div class="param-row"><span class="label label-low">低 ↓</span><div class="value">' + escapeHtml(pr.low) + '</div></div>';
      if (pr.sweet) html += '<div class="param-row"><span class="label label-sweet">甜区</span><div class="value">' + escapeHtml(pr.sweet) + '</div></div>';
      if (pr.example) html += '<div class="param-row"><span class="label label-eg">举例</span><div class="value">' + escapeHtml(pr.example) + '</div></div>';
      html += '</div>';
    });
    html += '</div></div>';
  }

  // NEW: 选品对比例子
  if (ext && ext.caseCompare) {
    const cc = ext.caseCompare;
    html += '<div class="section"><div class="section-title"><span class="icon">⚖️</span>选品对比例子：应该选 vs 不应该选</div>';
    html += '<div class="case-compare">';
    if (cc.good) {
      html += '<div class="case-good">';
      html += '<div class="ctitle">' + escapeHtml(cc.good.title || '') + '</div>';
      if (cc.good.details && cc.good.details.length) {
        html += '<div class="case-details">';
        cc.good.details.forEach(d => html += '<div>• ' + escapeHtml(d) + '</div>');
        html += '</div>';
      }
      if (cc.good.reason) html += '<div class="case-reason">' + escapeHtml(cc.good.reason) + '</div>';
      html += '</div>';
    }
    if (cc.bad) {
      html += '<div class="case-bad">';
      html += '<div class="ctitle">' + escapeHtml(cc.bad.title || '') + '</div>';
      if (cc.bad.details && cc.bad.details.length) {
        html += '<div class="case-details">';
        cc.bad.details.forEach(d => html += '<div>• ' + escapeHtml(d) + '</div>');
        html += '</div>';
      }
      if (cc.bad.reason) html += '<div class="case-reason">' + escapeHtml(cc.bad.reason) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    if (cc.insight) html += '<div class="case-insight"><strong>💡 关键差异分析：</strong>' + escapeHtml(cc.insight) + '</div>';
    html += '</div>';
  }

  if (l2.ai && l2.ai.length) {
    html += '<div class="section"><div class="section-title"><span class="icon">🤖</span>AI 化建议 (Agent Hints)</div><div class="section-body">';
    l2.ai.forEach(a => html += '<div class="ai-card"><div class="ai-title">' + a[0] + '</div><div>' + a[1] + '</div></div>');
    html += '</div></div>';
  }

  if (l2.cases && l2.cases.length) {
    html += '<div class="section"><div class="section-title"><span class="icon">💡</span>典型案例 (Cases)</div><div class="section-body">';
    l2.cases.forEach(cs => html += '<div class="case-card"><div class="case-title">' + cs[0] + '</div><div>' + cs[1] + '</div></div>');
    html += '</div></div>';
  }

  if (l2.risks && l2.risks.length) {
    html += '<div class="section"><div class="section-title"><span class="icon">⚠️</span>风险与反例 (Risks)</div><div class="section-body">';
    l2.risks.forEach(r => html += '<div class="risk-card">' + r + '</div>');
    html += '</div></div>';
  }

  document.getElementById('detail').innerHTML = html;
}

function escapeHtml(s) {
  if (typeof s !== 'string') return String(s);
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

  html += '</div>';

  // Module cards
  PIPELINE.forEach((m, i) => {
    html += '<div class="module-card" id="' + m.id + '" style="--m-color:' + m.color + '; border-left-color:' + m.color + '">';
    html += '<div class="mod-num">' + (i === 0 ? 'START' : 'MODULE ' + i) + '</div>';
    html += '<h3>' + m.title + '</h3>';
    html += '<div class="subtitle">' + m.subtitle + '</div>';

    html += '<div class="module-flow">';
    html += '<div class="io-box input"><div class="label">📥 输入</div><div class="value">' + escapeHtml(m.input) + '</div></div>';
    html += '<div class="tasks"><div class="label">⚙️ 模块内任务</div><ol>';
    m.tasks.forEach(t => {
      html += '<li>' + boldify(escapeHtml(t)) + '</li>';
    });
    html += '</ol></div>';
    html += '<div class="io-box output"><div class="label">📤 输出</div><div class="value">' + escapeHtml(m.output) + '</div></div>';
    html += '</div>';

    html += '<div class="module-meta">';
    html += '<div class="tools-box"><div class="label">🛠️ 关键工具 / Agent</div><div class="value">' + escapeHtml(m.tools) + '</div></div>';
    html += '<div class="blockers-box"><div class="label">⚠️ 关键卡点</div><div class="value">' + escapeHtml(m.blockers) + '</div></div>';
    html += '</div>';

    if (m.related && m.related.length) {
      html += '<div class="module-related">';
      html += '<span style="font-size:11px;color:#6b7280;margin-right:6px;align-self:center;">关联策略:</span>';
      m.related.forEach(rid => {
        const tname = findStrategyName(rid);
        if (tname) html += '<span class="relchip" onclick="switchView(\'mindmap\');setTimeout(()=>showDetail(\''+rid.split(".")[0]+'\',\''+rid+'\'),100)">' + rid.toUpperCase() + ' ' + tname + '</span>';
      });
      html += '</div>';
    }
    html += '</div>';

    if (i < PIPELINE.length - 1) {
      html += '<div class="flow-connector">↓</div>';
    }
  });

  el.innerHTML = html;
}

function findStrategyName(rid) {
  for (const ck in DATA) {
    if (DATA[ck].children && DATA[ck].children[rid]) {
      const t = DATA[ck].children[rid].title;
      // Extract short part after C*.x
      const m = t.match(/^(C\d+\.\d+)\s+(.+)$/);
      return m ? m[2] : t.replace(/^C\d+\.\d+\s*/, '');
    }
  }
  return null;
}

function boldify(s) {
  // Make 【xxx】 bold
  return s.replace(/【([^】]+)】/g, '<b>【$1】</b>');
}

// ========== View switching ==========
function switchView(v) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  if (v === 'mindmap') {
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
    document.getElementById('view-mindmap').classList.add('active');
  } else {
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    document.getElementById('view-pipeline').classList.add('active');
    if (!document.getElementById('pipeline-content').innerHTML.trim()) {
      renderPipeline();
    }
  }
}

// Search
document.getElementById('search').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase().trim();
  if (!q) {
    document.querySelectorAll('.l2-node').forEach(el => el.style.display = '');
    document.querySelectorAll('.cluster').forEach(el => el.style.display = '');
    return;
  }
  Object.keys(DATA).forEach(cKey => {
    const c = DATA[cKey];
    let clusterMatch = c.title.toLowerCase().includes(q) || (c.philosophy || '').toLowerCase().includes(q);
    let anyChildMatch = false;
    Object.keys(c.children).forEach(lKey => {
      const l2 = c.children[lKey];
      const ext = (typeof EXTENSIONS !== 'undefined') ? EXTENSIONS[lKey] : null;
      const json = (JSON.stringify(l2) + JSON.stringify(ext || {})).toLowerCase();
      const match = json.includes(q);
      const node = document.querySelector('[data-id="' + lKey + '"]');
      if (node) {
        node.style.display = match ? '' : 'none';
        if (match) anyChildMatch = true;
      }
    });
    const cl = document.querySelector('[data-cluster="' + cKey + '"]');
    if (cl) cl.style.display = (clusterMatch || anyChildMatch) ? '' : 'none';
  });
});

renderTree();
console.log('哈佛 AI 选品策略 v2.0 已加载', { clusters: Object.keys(DATA).length, strategies: Object.keys(EXTENSIONS || {}).length, modules: PIPELINE.length });
</script>
